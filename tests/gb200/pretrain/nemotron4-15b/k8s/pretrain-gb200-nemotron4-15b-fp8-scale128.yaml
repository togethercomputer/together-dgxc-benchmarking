apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: pretrain-gb200-nemotron4-15b-fp8
  namespace: default
spec:
  network:
    enableDNSHostnames: true
  replicatedJobs:
  - name: worker
    replicas: 32
    template:
      spec:
        completions: 1
        parallelism: 1
        backoffLimit: 0
        template:
          spec:
            hostNetwork: true
            hostIPC: true
            # Required for cluster DNS resolution when using hostNetwork
            dnsPolicy: ClusterFirstWithHostNet
            restartPolicy: Never
            containers:
            - name: pretrain-nemotron4-15b
              image: nvcr.io/nvidia/nemo:25.09.00
              command: ["bash", "-c"]
              args:
              - |
                # Extract node rank from hostname: <jobset>-worker-<NODE_RANK>-<pod_idx>
                NODE_RANK=$(echo $HOSTNAME | awk -F'-' '{print $(NF-1)}')
                MASTER_ADDR="pretrain-gb200-nemotron4-15b-fp8-worker-0-0.pretrain-gb200-nemotron4-15b-fp8-worker"

                echo "NODE_RANK=${NODE_RANK}, MASTER_ADDR=${MASTER_ADDR}"

                mkdir -p /logs && \
                torchrun \
                  --nproc_per_node=4 \
                  --nnodes=32 \
                  --node_rank=${NODE_RANK} \
                  --master_addr=${MASTER_ADDR} \
                  --master_port=29500 \
                  -m nemo_run.core.runners.fdl_runner \
                  -n pretrain_nemotron4_15b_fp8_gpus128_tp1_pp1_cp1_vp1_mbs2_gbs512 \
                  /nemo_run/configs/pretrain_nemotron4_15b_fp8_gpus128_tp1_pp1_cp1_vp1_mbs2_gbs512_fn_or_script \
                2>&1 | tee /logs/pretrain-gb200-nemotron4-15b-fp8-${NODE_RANK}.log
              resources:
                limits:
                  nvidia.com/gpu: "4"
              securityContext:
                capabilities:
                  add: ["SYS_NICE"]
                seccompProfile:
                  type: Unconfined
              env:
              - name: MASTER_PORT
                value: "29500"
              - name: TORCH_NCCL_AVOID_RECORD_STREAMS
                value: "1"
              - name: TRANSFORMERS_OFFLINE
                value: "1"
              - name: TOKENIZERS_PARALLELISM
                value: "False"
              - name: NCCL_NVLS_ENABLE
                value: "0"
              - name: NVTE_FLASH_ATTN
                value: "1"
              - name: NVTE_FUSED_ATTN
                value: "1"
              - name: NEMO_LOG_MEMORY_USAGE
                value: "1"
              - name: TORCH_NCCL_HIGH_PRIORITY
                value: "1"
              - name: NVTE_FWD_LAYERNORM_SM_MARGIN
                value: "16"
              - name: NVTE_BWD_LAYERNORM_SM_MARGIN
                value: "16"
              - name: NEMORUN_HOME
                value: "/home/johnson/dgxc-benchmarking/llmb-workloads/workloads/pretrain_nemotron4-15b"
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-token-secret
                    key: HF_TOKEN
              volumeMounts:
              - name: nemo-run
                mountPath: /nemo_run
              - name: hf-cache
                mountPath: /home/johnson/dgxc-benchmarking/llmb-workloads/.cache/huggingface
              - name: logs
                mountPath: /logs
            volumes:
            - name: nemo-run
              hostPath:
                path: /home/johnson/dgxc-benchmarking/llmb-workloads/workloads/pretrain_nemotron4-15b/experiments/pretrain_nemotron4_15b_fp8_gpus128_tp1_pp1_cp1_vp1_mbs2_gbs512/pretrain_nemotron4_15b_fp8_gpus128_tp1_pp1_cp1_vp1_mbs2_gbs512_1774931771/pretrain_nemotron4_15b_fp8_gpus128_tp1_pp1_cp1_vp1_mbs2_gbs512
                type: Directory
            - name: hf-cache
              hostPath:
                path: /home/johnson/dgxc-benchmarking/llmb-workloads/.cache/huggingface
                type: DirectoryOrCreate
            - name: logs
              hostPath:
                path: /home/johnson/scratch/k8s_jobs/logs
                type: DirectoryOrCreate
