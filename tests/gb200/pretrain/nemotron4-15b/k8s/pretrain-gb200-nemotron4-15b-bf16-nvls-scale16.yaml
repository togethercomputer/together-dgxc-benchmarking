apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: pretrain-gb200-nemotron4-15b-bf16-nvls
  namespace: default
spec:
  network:
    enableDNSHostnames: true
  replicatedJobs:
  - name: worker
    replicas: 4
    template:
      spec:
        completions: 1
        parallelism: 1
        backoffLimit: 0
        template:
          spec:
            restartPolicy: Never
            initContainers:
            - name: setup-nemo-run
              image: busybox
              command: ["sh", "-c"]
              args:
              - |
                mkdir -p /nemo_run/configs /nemo_run/scripts && \
                cp /configmap/pretrain_nemotron4_15b_bf16_gpus16_tp1_pp1_cp1_vp1_mbs2_gbs64_config.yaml   /nemo_run/configs/ && \
                cp /configmap/pretrain_nemotron4_15b_bf16_gpus16_tp1_pp1_cp1_vp1_mbs2_gbs64_executor.yaml  /nemo_run/configs/ && \
                cp /configmap/pretrain_nemotron4_15b_bf16_gpus16_tp1_pp1_cp1_vp1_mbs2_gbs64_fn_or_script   /nemo_run/configs/ && \
                cp /configmap/pretrain_nemotron4_15b_bf16_gpus16_tp1_pp1_cp1_vp1_mbs2_gbs64_packager        /nemo_run/configs/ && \
                cp /configmap/pretrain_nemotron4_15b_bf16_gpus16_tp1_pp1_cp1_vp1_mbs2_gbs64.sh              /nemo_run/scripts/ && \
                chmod +x /nemo_run/scripts/*.sh
              volumeMounts:
              - name: nemo-run
                mountPath: /nemo_run
              - name: experiment-configs
                mountPath: /configmap
            containers:
            - name: pretrain-nemotron4-15b
              image: nvcr.io/nvidia/nemo:25.09.00
              command: ["bash", "-c"]
              args:
              - |
                NODE_RANK=${JOB_COMPLETION_INDEX}
                MASTER_ADDR="pretrain-gb200-nemotron4-15b-bf16-nvls-worker-0-0.pretrain-gb200-nemotron4-15b-bf16-nvls"

                echo "NODE_RANK=${NODE_RANK}, MASTER_ADDR=${MASTER_ADDR}"

                if [ "${NODE_RANK}" != "0" ]; then
                  echo "Worker rank ${NODE_RANK}: waiting 30s for master to initialize..."
                  sleep 30
                fi

                torchrun \
                  --nproc_per_node=4 \
                  --nnodes=4 \
                  --rdzv_backend=c10d \
                  --rdzv_endpoint=${MASTER_ADDR}:29500 \
                  --rdzv_id=pretrain-gb200-nemotron4-15b-bf16-nvls \
                  -m nemo_run.core.runners.fdl_runner \
                  -n pretrain_nemotron4_15b_bf16_gpus16_tp1_pp1_cp1_vp1_mbs2_gbs64 \
                  /nemo_run/configs/pretrain_nemotron4_15b_bf16_gpus16_tp1_pp1_cp1_vp1_mbs2_gbs64_fn_or_script \
                2>&1 | tee /logs/pretrain-gb200-nemotron4-15b-bf16-nvls-${NODE_RANK}.log
              resources:
                limits:
                  nvidia.com/gpu: "4"
              securityContext:
                capabilities:
                  add: ["SYS_NICE"]
                seccompProfile:
                  type: Unconfined
              env:
              - name: JOB_COMPLETION_INDEX
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
              - name: MASTER_PORT
                value: "29500"
              - name: TORCH_NCCL_AVOID_RECORD_STREAMS
                value: "1"
              - name: TRANSFORMERS_OFFLINE
                value: "0"
              - name: TOKENIZERS_PARALLELISM
                value: "False"
              - name: NCCL_NVLS_ENABLE
                value: "1"
              - name: NCCL_MNNVL_ENABLE
                value: "0"
              - name: NVTE_FLASH_ATTN
                value: "1"
              - name: NVTE_FUSED_ATTN
                value: "1"
              - name: NEMO_LOG_MEMORY_USAGE
                value: "1"
              - name: TORCH_NCCL_HIGH_PRIORITY
                value: "1"
              - name: NVTE_FWD_LAYERNORM_SM_MARGIN
                value: "16"
              - name: NVTE_BWD_LAYERNORM_SM_MARGIN
                value: "16"
              - name: NEMORUN_HOME
                value: "/home/johnson/dgxc-benchmarking/llmb-workloads/workloads/pretrain_nemotron4-15b"
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-token-secret
                    key: HF_TOKEN
              volumeMounts:
              - name: nemo-run
                mountPath: /nemo_run
              - name: logs
                mountPath: /logs
              - name: dshm
                mountPath: /dev/shm
            volumes:
            - name: nemo-run
              emptyDir: {}
            - name: experiment-configs
              configMap:
                name: nemotron4-15b-bf16-configs
            - name: logs
              emptyDir: {}
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 128Gi
